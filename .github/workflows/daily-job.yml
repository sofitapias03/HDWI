name: Daily Python Run

on:
  schedule:
    - cron: '45 4 * * *  # 11 pm Calgary UTC-6
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        run: python script.py